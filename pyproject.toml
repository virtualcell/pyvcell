[project]
name = "pyvcell"
version = "0.3.1"
requires-python = ">=3.12,<4.0"
description = "This is the python wrapper for vcell modeling and simulation"
repository = "https://github.com/virtualcell/pyvcell"
documentation = "https://virtualcell.github.io/pyvcell/"
readme = "README.md"
authors = [
    {name = "Jim Schaff",       email = "schaff@uchc.edu"},
    {name = "Logan Drescher",   email = "drescher@uchc.edu"}
]

packages = [
    {include="pyvcell"},
]
# Core: just what the data models + VCML reader/writer need. Heavy runtime deps
# live in the optional-dependencies extras below; install pyvcell[all] for the
# full feature set (solver, viz, remote, io, convert, native).
dependencies = [
    "lxml>=6.1.0,<7",
    "numexpr>=2.10,<3",
    "numpy>=1.26.4,<3.0",
    "pydantic>=2.10.5,<3",
    "typing-extensions>=4.12.2,<5",
]

[project.optional-dependencies]
solver = [
    "pyvcell-fvsolver (>=0.2.1)",
]
viz = [
    "imageio>=2.37.0,<3",
    "matplotlib>=3.10.0,<4",
    "pyvista>=0.44.2,<1",
    "trame>=3.8.1,<4",
    "trame-server>=3.4.0,<4",
    "trame-vtk>=2.8.15,<3",
    "trame-vuetify>=3.2.2,<4",
    "vtk>=9.3.1,<10",
]
remote = [
    "overrides>=7.7.0,<8",
    "python-dateutil>=2.8.2,<3",
    "requests>=2.32.3,<3",
    "requests-oauth2client>=1.6.0,<2",
    "urllib3>=2.3.0,<3",
]
io = [
    "h5py>=3.11.0,<4",
    "orjson>=3.10.3,<4",
    "tensorstore>=0.1.72,<1",
    "typer>=0.12.3,<1.0.0",
    "zarr>=2.17.2,<3", # major upgrade will take some work!
]
convert = [
    "antimony (>=3.1.3)",
    "python-libsbml>=5.20.4,<6",
    "sympy>=1.13.1,<2",
]
native = [
    "libvcell (>=0.0.15.3)",
]
all = [
    "pyvcell[solver,viz,remote,io,convert,native]",
]

[dependency-groups]
dev = [
    # Dev/CI work against the full feature set (all optional extras). End users
    # opt in per extra (e.g. `pip install pyvcell[viz]`) or `pip install pyvcell[all]`.
    "pyvcell[all]",
    "pytest>=7.2.0,<8",
    "pytest-cov>=4.0.0,<5",
    "deptry>=0.16.2,<1",
    "mypy>=1.5.1,<2",
    "pre-commit>=3.8.0,<4",
    "tox>=4.11.1,<5",
    "types-requests>=2.32.0.20241016,<3",
    "notebook>=7.3.2,<8",
    "lxml-stubs>=0.5.1,<1",
    "trame-jupyter-extension>=2.1.4,<3",
    "ipywidgets>=8.1.5,<9",
    "copasi-basico>=0.65,<1",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.5.50,<10",
    "mkdocstrings[python]>=0.27.0,<1",
    "griffe>=1.5.5,<2",
    "mkdocs-jupyter>=0.25.1,<1",
]

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pyvcell"
module-root = ""

[tool.deptry.per_rule_ignores]
# `pyvcell[all]` is in the dev group so dev/CI install every optional extra;
# it is a self-reference (first-party), so deptry's "unused dependency" check
# does not apply.
DEP002 = ["pyvcell"]

[tool.mypy]
files = ["pyvcell", "tests", "examples"]
exclude = ["stubs.*"]
strict = true

[[tool.mypy.overrides]]
module = [ "pyvcell._internal.api.*" ]
disable_error_code = ["import-not-found", "import-untyped", "no-untyped-def", "no-untyped-call", "attr-defined",
    "type-arg", "union-attr", "no-any-return", "return"]

[[tool.mypy.overrides]]
module = "zarr"
ignore_missing_imports = true
disable_error_code = [
    "import-not-found", "import-untyped", "no-untyped-def",
    "no-untyped-call", "attr-defined", "type-arg", "union-attr",
    "no-any-return", "return"
]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
disable_error_code = [
    "import-untyped"
]

[[tool.mypy.overrides]]
module = "trame.*"
ignore_missing_imports = true
disable_error_code = [
    "import-untyped"
]

[[tool.mypy.overrides]]
module = "trame_server.*"
ignore_missing_imports = true
disable_error_code = [
    "import-untyped"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
lint.ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # avoid specifiying long messages outside the exception class
    "TRY003",
    # avoid functions which are too complex
    "C901",
    # avoid uses of Uses of `tarfile.extractall()
    "S202",
    #  B008 Do not perform function call `typer.Argument` in argument defaults
    "B008",
    # Using `lxml` to parse untrusted data is known to be vulnerable to XML attacks
    "S320",
]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["pyvcell"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"stubs/libsbml/__init__.pyi" = ["ALL"]
